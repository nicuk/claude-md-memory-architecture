<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Cairn Memory: CLAUDE.md and agent memory that stays true">
<style>
.drop { animation: drop .7s cubic-bezier(.2,.9,.3,1.25) both; }
@keyframes drop { from { transform: translateY(-260px); opacity: 0; } 60% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
.glow { animation: glow 3.2s ease-in-out 1.8s infinite; transform-origin: 236px 136px; }
@keyframes glow { 0%,100% { opacity: .0; } 50% { opacity: .55; } }
.fade { animation: fade .9s ease-out both; }
