<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 572" width="1280" height="572" role="img" aria-label="Where each fact belongs: what loads every session, what loads on demand, and what is enforced rather than read">
<style>
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
