<rect x="1" y="1" width="1278" height="570" rx="28" fill="#F6F9FF" stroke="#DCE5F5" stroke-width="2"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0A6CFF">WHERE EACH FACT BELONGS</text>
<g class="pop" style="animation-delay:0.20s"><rect x="40" y="80" width="384" height="5" rx="2.5" fill="#0A6CFF"/><text x="40" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Loads every session</text><text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">costs tokens every time — keep it tiny</text></g><g class="pop" style="animation-delay:0.90s"><rect x="40" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">~/.claude/CLAUDE.md</text><text x="70" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">preferences true in every repo</text></g><g class="pop" style="animation-delay:1.02s"><rect x="40" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">CLAUDE.md / AGENTS.md</text><text x="70" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">rules that change a decision</text></g><g class="pop" style="animation-delay:1.14s"><rect x="40" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#0A6CFF" stroke-opacity=".6" stroke-width="2"/><text x="70" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">MEMORY.md index</text><text x="70" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">one-line hooks · first 200 lines / 25KB only</text></g><g class="pop" style="animation-delay:0.45s"><rect x="448" y="80" width="384" height="5" rx="2.5" fill="#6CCBFF"/><text x="448" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Loads on demand</text><text x="448" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">costs only when it's needed</text></g><g class="pop" style="animation-delay:1.26s"><rect x="448" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">.claude/rules/*.md</text><text x="478" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">invariants for a path glob</text></g><g class="pop" style="animation-delay:1.38s"><rect x="448" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">folder CLAUDE.md</text><text x="478" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">what the code can't show</text></g><g class="pop" style="animation-delay:1.50s"><rect x="448" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">memory topic files</text><text x="478" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">one fact each, dated</text></g><g class="pop" style="animation-delay:1.62s"><rect x="448" y="440" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#6CCBFF" stroke-opacity=".6" stroke-width="2"/><text x="478" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">repo docs &amp; registries</text><text x="478" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">decisions, evidence, closed questions</text></g><g class="pop" style="animation-delay:0.70s"><rect x="856" y="80" width="384" height="5" rx="2.5" fill="#16A34A"/><text x="856" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Never read — enforced</text><text x="856" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5B6B85">can't be skipped or forgotten</text></g><g class="pop" style="animation-delay:1.74s"><rect x="856" y="164" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#16A34A" stroke-opacity=".6" stroke-width="2"/><text x="886" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">deny rules</text><text x="886" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">.claude/settings.json</text></g><g class="pop" style="animation-delay:1.86s"><rect x="856" y="256" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#16A34A" stroke-opacity=".6" stroke-width="2"/><text x="886" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">hooks</text><text x="886" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">block the action itself</text></g><g class="pop" style="animation-delay:1.98s"><rect x="856" y="348" width="384" height="78" rx="39" fill="#FFFFFF" stroke="#16A34A" stroke-opacity=".6" stroke-width="2"/><text x="886" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#111827">CI checks</text><text x="886" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">fail the build when it rots</text></g>
</svg>
